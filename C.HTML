<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Amazing Styled Web Page</title>
  <style>
    /* General page background */
    body {
      background-image: url('https://picsum.photos/1200/800?blur'); /* Page background */
      background-size: cover;
      background-attachment: fixed;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      color: #fff;
    }

    /* Heading style */
    h1 {
      font-family: 'Georgia', serif;
      color: #ffcc00;
      text-align: center;
      text-shadow: 2px 2px 5px black;
      margin-top: 50px;
    }

    /* Paragraph style */
    p {
      font-family: 'Verdana', sans-serif;
      font-size: 18px;
      color: #e0e0e0;
      line-height: 1.6;
      text-align: center;
      margin: 20px auto;
      width: 70%;
    }

    /* Special box with its own background */
    .highlight-box {
      background-image: url('https://picsum.photos/600/400');
      background-size: cover;
      background-position: center;
      border: 3px solid #fff;
      border-radius: 15px;
      padding: 30px;
      margin: 40px auto;
      width: 60%;
      font-family: 'Courier New', monospace;
      color: #000;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.7);
    }

    /* Button style */
    .btn {
      display: inline-block;
      background-color: #ff0066;
      color: rgb(58, 140, 176);
      padding: 12px 25px;
      margin-top: 20px;
      border-radius: 25px;
      text-decoration: none;
      font-family: 'Tahoma', sans-serif;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #ffcc00;
      color: black;
    }
  </style>
</h
<body>
  <h1>Welcome to My Page</h1>
  <p>Vishesh Pratap Singh</p>

  <div class="highlight-box">
    <p>ASSIGNMENT</p>
    <a href="#" class="btn">Click Me</a>
  </div>
</body>
</html>
